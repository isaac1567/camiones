<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de camiones</title>
<meta name="description" content="Viajes, comprobantes, turnos, tarifas y mantenimiento de tus camiones.">
<meta name="theme-color" content="#15233B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camiones">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3E7EB; --paper:#FCFCFA; --paper-2:#F1F3F5; --ink:#15233B; --muted:#5A6678; --line:#CDD3DA;
  --cab:#15233B; --cab-ink:#F3F5F8; --cab-muted:#A9B4C3;
  --maize:#EFB21E; --maize-ink:#1E1604; --maize-soft:#F8DF9C;
  --stamp:#B8342A; --ok:#2B7349; --steel:#3E5C82;
  --s-desc:#BAC3CD; --s-venta:#7C8898; --s-coop:#A9855A; --s-chofer:#3E5C82; --s-queda:#EFB21E; --warn:#8A6200;
  --shadow:0 1px 2px rgba(21,35,59,.10), 0 2px 10px rgba(21,35,59,.05);
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --sans:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151D; --paper:#18212C; --paper-2:#1F2935; --ink:#E7ECF2; --muted:#98A4B3; --line:#2B3645;
    --cab:#0A0F15; --cab-ink:#EEF2F6; --cab-muted:#8C98A8;
    --maize:#F2BE3D; --maize-ink:#1E1604; --maize-soft:#5A4611;
    --stamp:#EF6B5F; --ok:#5DBB85; --steel:#7FA2CF;
    --s-desc:#3A4657; --s-venta:#66758A; --s-coop:#9C7B52; --s-chofer:#6F93C4; --s-queda:#F2BE3D; --warn:#F2BE3D;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151D; --paper:#18212C; --paper-2:#1F2935; --ink:#E7ECF2; --muted:#98A4B3; --line:#2B3645;
  --cab:#0A0F15; --cab-ink:#EEF2F6; --cab-muted:#8C98A8;
  --maize:#F2BE3D; --maize-ink:#1E1604; --maize-soft:#5A4611;
  --stamp:#EF6B5F; --ok:#5DBB85; --steel:#7FA2CF;
  --s-desc:#3A4657; --s-venta:#66758A; --s-coop:#9C7B52; --s-chofer:#6F93C4; --s-queda:#F2BE3D; --warn:#F2BE3D;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100%}
h1,h2,h3{font-family:var(--cond);font-weight:600;margin:0;line-height:1.1;letter-spacing:.005em}
p{margin:0}
button{font:inherit;color:inherit}
img{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mut{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* Cabina */
.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.cab{background:var(--cab);color:var(--cab-ink)}
.cab-in{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{width:30px;height:30px;color:var(--maize);flex:none}
.truck-pick{position:relative;min-width:0;display:grid}
#truck-sel{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--cab-ink);font:700 22px/1.15 var(--cond);padding:0 24px 0 0;margin:0;cursor:pointer;max-width:100%;min-width:0;text-overflow:ellipsis;border-radius:4px}
#truck-sel:disabled{cursor:default;opacity:1}
#truck-sel option{color:#15233B;background:#fff;font:500 16px var(--sans)}
.truck-pick .chev{position:absolute;right:2px;top:5px;width:17px;height:17px;pointer-events:none;color:var(--maize)}
#truck-sel:disabled+.chev{display:none}
#truck-sub{font-size:13px;color:var(--cab-muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--stamp);color:#fff;white-space:nowrap}
.pill:empty{display:none}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:8px;border:0;background:transparent;color:inherit;cursor:pointer}
.cab .icon-btn:hover{background:rgba(255,255,255,.08)}
.icon-btn svg{width:22px;height:22px}
.icon-btn:disabled{opacity:.3;cursor:default}

.tabs{background:var(--cab)}
.tabs-in{display:flex;gap:4px}
.tab{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--cab-muted);padding:10px 14px 12px;font:600 15px var(--sans);cursor:pointer;border-bottom:3px solid transparent}
.tab svg{width:19px;height:19px}
.tab[aria-selected="true"]{color:var(--cab-ink);border-bottom-color:var(--maize)}
.tab:hover{color:var(--cab-ink)}

main{padding:26px 0 48px}
@media (max-width:759px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs-in{display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:0}
  .tab{flex-direction:column;gap:3px;padding:9px 2px 8px;font-size:11.5px;color:var(--muted);border-bottom:0;border-top:3px solid transparent}
  .tab svg{width:22px;height:22px}
  .tab[aria-selected="true"]{color:var(--ink);border-top-color:var(--maize)}
  main{padding:16px 0 calc(84px + env(safe-area-inset-bottom,0px))}
}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;padding:10px 16px;font:600 15px var(--sans);cursor:pointer;white-space:nowrap;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--maize);border-color:var(--maize);color:var(--maize-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.danger{color:var(--stamp);border-color:transparent;background:transparent;padding-left:6px;padding-right:6px}
.btn.danger[data-armed]{background:var(--stamp);color:#fff}
.btn.big{font-size:17px;padding:14px 22px}
.btn:disabled{opacity:.55;cursor:default}
.linkish{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer}

/* Encabezados de vista */
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.view-head h1{font-size:32px;font-weight:700}
.view-head p{color:var(--muted);margin-top:2px}
.mesnav{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.mesnav h1{font-size:clamp(26px,7.4vw,34px);font-weight:700;flex:0 1 auto;margin-left:4px}
.mesnav .icon-btn{background:var(--paper);border:1px solid var(--line)}
.mesnav .grow{flex:1}

/* Comprobante (slip) */
.slip{background:var(--paper);border-radius:8px 8px 0 0;padding:18px 20px 22px;position:relative;box-shadow:var(--shadow);margin-bottom:14px}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;background:radial-gradient(circle at 7px 0,var(--paper) 7px,transparent 7.6px) 0 0/14px 9px repeat-x}
.slip-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px;padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:2px}
.slip-head h2{font-size:21px}
.slip-head p{color:var(--muted);font-size:14px;text-align:right}
.lines{margin:0}
.line{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.line dt{min-width:0}
.line dt small{display:block;color:var(--muted);font-size:13px;line-height:1.3;padding-left:1.35em;font-weight:400;font-family:var(--sans)}
.line dd{margin:0;font-variant-numeric:tabular-nums;font-weight:500;text-align:right;white-space:nowrap}
.op{display:inline-block;width:1.35em;color:var(--muted);font-family:var(--cond);font-weight:700}
.line.eq{border-bottom:1px solid var(--ink)}
.line.eq dt,.line.eq dd{font-weight:700}
.line.neg dd{color:var(--stamp)}
.line.big{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;column-gap:12px;row-gap:4px;padding:12px 0 10px;border-bottom:1px solid var(--ink)}
.line.big dd{margin-left:auto}
.line.big dt{font-family:var(--cond);font-size:22px;font-weight:700;white-space:nowrap}
.calc .line.big dd{font-size:clamp(30px,8vw,38px)}
.line.big dd{font-family:var(--cond);font-weight:700;font-size:clamp(34px,9vw,50px);line-height:1;padding:0 4px;background:linear-gradient(transparent 52%,var(--maize-soft) 52%,var(--maize-soft) 90%,transparent 90%)}
.line.big.neg dd{color:var(--stamp)}
.slip-foot{display:flex;justify-content:space-between;gap:10px;padding-top:12px;font-size:14px;color:var(--muted)}
.slip-foot strong{color:var(--ink);font-variant-numeric:tabular-nums}
.slip.empty{text-align:center;padding:36px 20px}
.slip.empty p{color:var(--muted);margin-bottom:14px}

.res-grid{display:grid;gap:18px;align-items:start}
@media (min-width:860px){.res-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}

/* Panel lateral */
.side{background:var(--paper);border-radius:8px;box-shadow:var(--shadow)}
.side-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.side-row:last-child{border-bottom:0}
.side-row h3{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--muted)}
.side-row .big{font-family:var(--cond);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;grid-column:1}
.side-row .note{font-size:13.5px;color:var(--muted);grid-column:1}
.side-row .btn{grid-column:2;grid-row:1/span 3;min-height:38px;padding:7px 12px;font-size:14px}
.big.due{color:var(--stamp)} .big.ok{color:var(--ok)}

/* Gráfica */
.panel{background:var(--paper);border-radius:8px;box-shadow:var(--shadow);padding:18px 20px;margin-top:18px}
.panel-head{margin-bottom:14px}
.panel-head h2{font-size:22px}
.panel-head p{color:var(--muted);font-size:14px;margin-top:3px}
.bars{display:grid;gap:4px}
.bar-row{display:grid;grid-template-columns:38px minmax(0,1fr) 108px;align-items:center;gap:10px;border:0;background:none;padding:6px;border-radius:6px;cursor:pointer;text-align:left}
.bar-row:hover{background:var(--paper-2)}
.bar-row[aria-current="true"]{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--maize)}
.bl{font-weight:600;font-size:14px}
.track{display:block}
.bar{display:flex;height:22px;border-radius:3px;overflow:hidden;min-width:4px}
.bar span{display:block;height:100%}
.s-queda{background:var(--s-queda)} .s-chofer{background:var(--s-chofer)} .s-venta{background:var(--s-venta)} .s-coop{background:var(--s-coop)} .s-desc{background:var(--s-desc)}
.bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}

/* Meses (chips) */
.chips{position:relative;display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font:600 14px var(--sans);cursor:pointer;white-space:nowrap;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* Totales */
.tot-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--paper);border-radius:8px;box-shadow:var(--shadow);margin:14px 0 0;overflow:hidden}
.tot-strip>div{padding:12px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
@media (min-width:760px){.tot-strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tot-strip small{display:block;color:var(--muted);font-size:13px}
.tot-strip b{font-family:var(--cond);font-size:clamp(18px,5vw,22px);overflow-wrap:anywhere;font-weight:700;font-variant-numeric:tabular-nums}
.tot-strip .hl b{background:linear-gradient(transparent 55%,var(--maize-soft) 55%,var(--maize-soft) 92%,transparent 92%);padding:0 3px}
.tot-strip .neg b{color:var(--stamp)}

/* Tabla */
.tbl-wrap{overflow-x:auto;background:var(--paper);border-radius:8px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font:600 13px var(--sans);color:var(--muted);text-align:right;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--paper)}
td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th.tl,td.tl{text-align:left}
th.tc,td.tc{text-align:center}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--paper-2)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0;background:var(--paper-2)}
td.q{font-weight:700}
td small{color:var(--muted);font-size:12px;margin-left:3px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--maize-soft);color:var(--ink)}
.paid{display:inline-grid;place-items:center;padding:6px;cursor:pointer}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);cursor:pointer;margin:0}

.only-wide{display:none}
@media (min-width:760px){.only-wide{display:block}.only-narrow{display:none!important}}

/* Lista móvil */
.list{list-style:none;margin:0;padding:0;background:var(--paper);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.li{border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li-main{display:block;width:100%;border:0;background:none;text-align:left;padding:13px 16px 8px;cursor:pointer}
.li-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.li-date{font-family:var(--cond);font-weight:700;font-size:19px}
.li-comp{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.li-trips{margin-left:auto;font-size:13.5px;color:var(--muted)}
.li-nums{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px}
.li-nums span{font-variant-numeric:tabular-nums;font-size:15px}
.li-nums small{display:block;color:var(--muted);font-size:12px}
.li-nums .q{font-weight:700;text-align:right}
.li-pay{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;font-size:14px;cursor:pointer}
.li-pay em{font-style:normal;margin-left:auto;font-weight:600;font-size:13px}
.li-pay.ok em{color:var(--ok)} .li-pay.due em{color:var(--stamp)}

/* Turnos */
.turnos{list-style:none;margin:0;padding:0;display:grid;gap:12px}
@media (min-width:760px){.turnos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.turno{display:grid;grid-template-columns:96px minmax(0,1fr);background:var(--paper);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.thumb{border:0;padding:0;background:var(--paper-2);cursor:pointer;min-height:112px;border-right:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.turno-body{padding:12px 14px;display:grid;gap:6px;align-content:start}
.turno-info{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:grid;gap:1px}
.t-comp{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.t-monto{font-family:var(--cond);font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.t-fecha{font-size:14px}
.t-cob{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;padding-top:4px}
.turnos.done .turno{opacity:.72}
.sub{font-size:22px;margin:26px 0 10px}
.empty-note{background:var(--paper);border-radius:8px;padding:22px;color:var(--muted);text-align:center;box-shadow:var(--shadow)}

/* Tarifas */
.tar-grid{display:grid;gap:18px;align-items:start}
@media (min-width:980px){.tar-grid{grid-template-columns:minmax(0,350px) minmax(0,1fr)}.calc{position:sticky;top:130px}}
.t-tar th,.t-tar td{padding:6px 6px}
.t-tar tbody tr{cursor:default}
.lname{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:4px 0;cursor:pointer;font-weight:500;text-align:left}
.lname svg{width:14px;height:14px;color:var(--muted);opacity:0;flex:none}
.lname:hover svg,.lname:focus-visible svg{opacity:1}
.lname:hover{text-decoration:underline;text-underline-offset:3px}
.t-tar td.tl{padding-left:12px;white-space:normal;min-width:110px}
.t-tar th.tl{padding-left:12px}
.calc-in{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 0 6px}
.calc-in .field:first-child{grid-column:1/-1}
.calc-note{font-size:13px;color:var(--muted);padding-top:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:0 12px;margin-bottom:12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:none;font:500 16px var(--sans);color:var(--ink);padding:11px 0;width:100%;outline:none}
.pbtn{border:0;background:none;padding:4px 6px;border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:500}
.pbtn:hover{background:var(--maize-soft)}
.pbtn.sel{background:var(--maize);color:var(--maize-ink);font-weight:700}
.tl-item{padding:12px 16px;border-bottom:1px solid var(--line)}
.tl-item:last-child{border-bottom:0}
.tl-name{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600}
.tl-name .icon-btn{width:36px;height:36px;color:var(--muted)}
.tl-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pchip{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);background:var(--paper-2);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:13px}
.pchip b{font-size:15px;font-variant-numeric:tabular-nums}
.pchip.sel{background:var(--maize);border-color:var(--maize);color:var(--maize-ink)}
td .icon-btn{width:34px;height:34px;color:var(--muted)}

/* Formularios y diálogos */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);border-radius:12px;width:min(540px,calc(100% - 24px));max-height:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,13,22,.55)}
@media (max-width:640px){
  .dlg-foot .btn.primary{flex-grow:1}
  dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:16px 16px 0 0;max-height:calc(100% - env(safe-area-inset-top,0px) - 16px)}
}
.dlg{display:flex;flex-direction:column;max-height:inherit}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 20px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:24px}
.dlg-body{padding:16px 20px;overflow:auto;display:grid;gap:14px}
.dlg-foot{display:flex;align-items:center;gap:8px;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.dlg-foot .sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:5px;font-size:14px;color:var(--muted);font-weight:500;min-width:0}
.field input,.field select{font:500 17px var(--sans);color:var(--ink);background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:10px 12px;width:100%;min-height:46px;min-width:0}
.field input:focus,.field select:focus{border-color:var(--steel);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--steel) 25%,transparent)}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;padding:3px;margin:0;gap:3px;background:var(--paper-2)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:9px;border-radius:6px;font-weight:600}
.seg input:checked+span{background:var(--ink);color:var(--paper)}
.seg input:focus-visible+span{outline:2px solid var(--steel)}
.preview{background:var(--paper-2);border-radius:8px;padding:6px 14px}
.preview .line:last-child{border-bottom:0}
.err{color:var(--stamp);font-weight:600;font-size:14px}
.err:empty{display:none}
.hint{font-size:13.5px;color:var(--muted)}
.photo-box{display:grid;gap:8px}
.photo-box img{border-radius:8px;max-height:260px;object-fit:contain;background:var(--paper-2);width:100%}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.viewer img{display:block;width:100%;max-height:78vh;object-fit:contain;background:#000}
.settings-sec{display:grid;gap:12px}
@media (max-width:640px){.settings-sec .grid2{grid-template-columns:1fr}}
.settings-sec .field small{font-weight:400}
.settings-sec h3{font-family:var(--sans);font-size:15px;font-weight:700}


/* Casillas dentro del recibo */
.line.toggle dt small{padding-left:30px}
.tgl{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.line.toggle.off .tgl span{color:var(--muted)}
.side-row .note.due{color:var(--stamp);font-weight:600} .side-row .note.soon{color:var(--warn);font-weight:600} .side-row .note.ok{color:var(--ok)}
.head-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px}

/* Calculadora: descuentos */
.desc-box{display:grid;gap:10px;padding:12px 0 6px;border-top:1px dashed var(--line);margin-top:8px}
.desc-title{font-weight:600;font-size:14px;color:var(--muted)}
.seg.seg4{grid-template-columns:repeat(4,1fr)}
.seg.seg4 span{padding:8px 2px;font-size:14px;white-space:nowrap}
.callout{background:var(--paper-2);border-left:4px solid var(--maize);padding:10px 12px;border-radius:4px;font-size:14.5px;margin:10px 0 4px}
.callout b{font-family:var(--cond);font-size:23px;font-weight:700}
.callout[hidden]{display:none}
.neg-t{color:var(--stamp);font-weight:600}
.line.neg dd{color:var(--stamp)}

/* Perfil */
.fleet{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.truck-card{background:var(--paper);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;border-top:4px solid var(--line);display:flex;flex-direction:column}
.truck-card.on{border-top-color:var(--maize)}
.tc-name{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:14px 16px 12px;text-align:left;cursor:pointer}
.tc-name svg{width:32px;height:32px;color:var(--steel);flex:none}
.tc-name span{min-width:0}
.tc-name b{font-family:var(--cond);font-size:23px;font-weight:700;display:block;line-height:1.1}
.tc-name small{color:var(--muted);font-size:13.5px;display:block}
.tc-name em{margin-left:auto;font-style:normal;font-size:12.5px;font-weight:600;background:var(--maize-soft);padding:2px 8px;border-radius:4px;flex:none}
.tc-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.tc-grid button{border:0;background:none;text-align:left;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--line);min-width:0}
.tc-grid button:nth-child(odd){border-right:1px solid var(--line)}
.tc-grid button:hover,.tc-name:hover{background:var(--paper-2)}
.tc-grid small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.tc-grid b{display:block;font-family:var(--cond);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.tc-grid span{display:block;font-size:12.5px;color:var(--muted)}
.tc-mant{border:0;background:none;text-align:left;padding:11px 16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;margin-top:auto}
.tc-mant.due{color:var(--stamp)} .tc-mant.soon{color:var(--warn)} .tc-mant.ok{color:var(--ok)}
.fleet-total{margin:0 0 6px;color:var(--muted)}
.fleet-total b{color:var(--ink);font-variant-numeric:tabular-nums}
.prof-title{font-size:30px;font-weight:700;margin:26px 0 0}
.prof-grid{display:grid;gap:0 18px;align-items:start}
@media (min-width:900px){.prof-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}}
.prof-grid .panel{margin-top:14px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.ph h2{font-size:23px}
.ph p{color:var(--muted);font-size:14px;margin-top:2px}
.params{margin:0}
.params>div{display:grid;grid-template-columns:minmax(100px,38%) 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.params>div:last-child{border-bottom:0}
.params dt{color:var(--muted);font-size:14px}
.params dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.piezas{list-style:none;margin:0;padding:0}
.pieza{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pieza:last-child{border-bottom:0}
.pz-main{border:0;background:none;padding:0;text-align:left;cursor:pointer;grid-row:span 2;min-width:0}
.pz-main b{display:block;font-size:16px;font-weight:600}
.pz-main small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35}
.pz-main:hover b{text-decoration:underline;text-underline-offset:3px}
.st{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:4px;justify-self:end;text-align:right;max-width:190px}
.st-due{background:var(--stamp);color:#fff} .st-soon{background:var(--maize);color:var(--maize-ink)} .st-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)} .st-none{color:var(--muted);background:var(--paper-2)}
.pieza .btn{justify-self:end}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugs .pchip{font-weight:500;font-size:13.5px}
.hist{list-style:none;margin:0;padding:0}
.hist-row{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;border:0;background:none;padding:12px 6px;text-align:left;cursor:pointer;border-bottom:1px solid var(--line);border-radius:0}
.hist li:last-child .hist-row{border-bottom:0}
.hist-row:hover{background:var(--paper-2)}
.h-date b{display:block;font-family:var(--cond);font-size:26px;font-weight:700;line-height:1}
.h-date small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.h-main{min-width:0}
.h-main b{display:block;font-weight:600}
.h-main small{display:block;color:var(--muted);font-size:13.5px}
.h-com{font-style:italic;overflow-wrap:anywhere}
.h-cost{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:6px}
.h-cost svg{width:17px;height:17px;color:var(--muted)}
.hist-tot{padding-top:10px;border-top:2px solid var(--ink);margin-top:4px;text-align:right}
.panel .chips{margin-bottom:4px}
.rows{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 40px;gap:8px;align-items:center}
.prow.p2{grid-template-columns:minmax(0,1fr) 40px}
.prow input{font:500 16px var(--sans);color:var(--ink);background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:9px 10px;min-height:44px;width:100%;min-width:0}
.prow .pk{font-weight:600}
.prow input:focus{border-color:var(--steel);outline:none}
.prow .icon-btn{color:var(--muted)}
.field.full{grid-column:1/-1}
.field textarea{font:500 16px/1.4 var(--sans);color:var(--ink);background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:10px 12px;width:100%;resize:vertical}
.field textarea:focus{border-color:var(--steel);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--steel) 25%,transparent)}
.pz-hist{background:var(--paper-2);border-radius:8px;padding:12px 14px}
.pz-hist h3{font:600 14px var(--sans);color:var(--muted);margin-bottom:6px}
.pz-hist ul{list-style:none;margin:0 0 8px;padding:0}
.pz-hist li button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.dlg-foot{flex-wrap:wrap}


/* Rutas y clientes */

.chips.origins{margin-bottom:2px}
.chip small{font-weight:500;opacity:.7;margin-left:3px}
.chip.ghost{border-style:dashed;background:transparent;color:var(--muted)}
.origin-bar{font-size:14px;color:var(--muted);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.origin-bar b{color:var(--ink)}
.origin-bar .linkish{font-size:13.5px}
.clis{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cli{display:inline-block;font-size:12.5px;font-weight:600;background:var(--paper-2);border:1px solid var(--line);border-radius:4px;padding:1px 7px;white-space:normal}
.cli small{font-weight:400;color:var(--muted);margin-left:5px}
.from{display:block;font-size:12px;color:var(--muted);font-weight:600}
.t-tar td.tl .lname{padding:2px 0}
.tl-name>span{min-width:0}
.cli-note{font-size:14px;background:var(--paper-2);border-radius:6px;padding:8px 10px;margin:4px 0 2px}
.cli-note[hidden]{display:none}
.sub-sec{display:grid;gap:8px}
.sub-lab{font-weight:700;font-size:15px}
@media (max-width:979px){.tar-grid>section:last-child{order:-1}}


/* Foto del comprobante en viajes */
.cam{display:inline-grid;place-items:center;vertical-align:middle;margin-left:6px;width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--paper-2);color:var(--steel);cursor:pointer;padding:0}
.cam svg{width:17px;height:17px}
.cam:hover{border-color:var(--steel)}
.li-foot{display:flex;align-items:center;gap:8px;padding-right:12px}
.li-foot .li-pay{flex:1;min-width:0}
.li-pay em{white-space:nowrap}
.li-cam{display:inline-grid;place-items:center;width:40px;height:38px;border:1px solid var(--line);background:var(--paper-2);color:var(--steel);border-radius:6px;padding:0;font:600 13px var(--sans);cursor:pointer;margin-bottom:4px;flex:none}
.li-cam svg{width:20px;height:20px}


/* PDF del comprobante */
.pdf-pages{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--paper-2);border-radius:8px;padding:6px}
.pdf-pages span{font-weight:600;font-size:14px}
.pdf-busy{background:var(--paper-2);border-radius:8px;padding:28px 12px;text-align:center;color:var(--muted);font-weight:600}


/* Desglose del papel */
.desglose{display:grid;gap:8px;background:var(--paper-2);border-radius:8px;padding:12px}
.desglose .field input{background:var(--paper)}
.neto-hint{margin-top:-8px}
.seg-lab{font-size:14px;font-weight:600;color:var(--muted);margin-top:2px}
td.est{color:var(--muted)}
.t-liq{font-size:14px}
.t-liq th,.t-liq td{padding:10px 7px}
.t-liq th:first-child,.t-liq td:first-child{padding-left:12px}
.t-liq td small{display:block;margin-left:0;line-height:1.1}
.t-liq th{white-space:normal;line-height:1.2;vertical-align:bottom}


/* Leer comprobantes */
dialog.wide{width:min(940px,calc(100% - 24px))}
@media (max-width:640px){dialog.wide{width:100%}}
.leer-status{background:var(--paper-2);border-radius:8px;padding:10px 12px;font-weight:600;font-size:14.5px}
.leer-status.bad{color:var(--stamp)}
.rcs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.rc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper);display:grid;gap:8px}
.rc.off{opacity:.55}
.rc.skip,.rc.wait,.rc.done{padding:8px 12px}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rc-top .check b{font-family:var(--cond);font-size:20px}
.rc-main{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:start}
.rc-img{border:1px solid var(--line);border-radius:6px;padding:0;background:#fff;cursor:zoom-in;overflow:hidden;display:block;width:92px}
.rc-img img{display:block;width:100%;height:auto}
.rc.zoom .rc-main{grid-template-columns:1fr}
.rc.zoom .rc-img{width:100%;cursor:zoom-out}
.rc-body b{display:block}
.rc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:700px){.rc-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.rc-main{grid-template-columns:1fr}.rc-img{width:120px}.rc.zoom .rc-img{width:100%}}
.rc-grid .field{font-size:12.5px;gap:3px}
.rc-grid .field input{font-size:15px;padding:7px 9px;min-height:38px}
.rc-lines{font-size:13.5px;color:var(--muted);line-height:1.4}
.rc-check{font-size:14px}
.ok-t{color:var(--ok);font-weight:600}
.tag.blue{background:color-mix(in srgb,var(--steel) 18%,transparent)}
.tag.gray{background:var(--paper-2);color:var(--muted)}
.lineas-info{background:var(--paper-2);border-radius:8px;padding:10px 12px;font-size:13.5px;display:grid;gap:3px}
.lineas-info b{font-size:14px}


.leer-why{background:var(--maize-soft);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.45}
.leer-steps{margin:0;padding-left:22px;display:grid;gap:12px;font-size:15px}
.leer-steps li{padding-left:2px}
.leer-steps .field,.leer-steps .file-btn{margin-top:8px}
.rc-img.none{display:grid;place-items:center;height:110px;color:var(--muted);font-size:13px;cursor:default;background:var(--paper-2)}


.leer-alt{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.leer-alt summary{cursor:pointer;font-weight:600}
.leer-alt[open] summary{margin-bottom:10px}
.leer-alt .leer-steps{margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}


/* Deuda del chofer */
.deuda-bar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;background:var(--paper);border-radius:8px;box-shadow:var(--shadow);padding:12px 16px;margin:0 0 14px;border-left:5px solid var(--ok)}
.deuda-bar.due{border-left-color:var(--stamp)}
.db-info{display:grid;min-width:0}
.db-info small{font-size:13px;font-weight:600;color:var(--muted)}
.db-info b{font-family:var(--cond);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.deuda-bar.due .db-info b{color:var(--stamp)}
.db-info span{font-size:13.5px;color:var(--muted)}
.db-btns{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h-cost.owe{color:var(--stamp)} .h-cost.pay{color:var(--ok)}
small.debt{color:var(--stamp);font-weight:600}
.t-liq td small.debt{display:block}
.deuda-field{background:var(--paper-2);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.deuda-field .field input{background:var(--paper)}
.line.sub-line{border-bottom:0;padding-top:4px}
.line.sub-line dt{font-weight:600}


/* Entrada con cuenta */
.app-name{display:none;font:700 22px/1.1 var(--cond);color:var(--cab-ink)}
body.sin-sesion .app-name,body.sin-camion .app-name{display:block}
body.sin-camion .tabs,body.sin-camion .truck-pick{display:none!important}
body.sin-sesion .tabs,body.sin-sesion [data-act="ajustes"],body.sin-sesion .truck-pick{display:none!important}
body.sin-sesion main{padding-bottom:40px}
.auth{max-width:440px;margin:6px auto 0;display:grid;gap:18px}
.auth-brand{text-align:center;display:grid;justify-items:center;gap:8px}
.auth-brand svg{width:68px;height:68px;color:var(--maize);background:var(--cab);border-radius:18px;padding:12px}
.auth-brand h1{font-size:34px;font-weight:700}
.auth-brand p{color:var(--muted);max-width:34ch}
.auth-card{background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:20px 20px 18px;display:grid;gap:14px}
.auth-card h2{font-size:24px}
.auth-card form{display:grid;gap:12px}
.auth-card .btn.big{width:100%}
.btn.google{width:100%;min-height:50px;gap:10px;font-size:16px;background:var(--paper);border:1px solid var(--line)}
.btn.google svg{width:22px;height:22px;flex:none}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;font-size:14.5px}
.auth-foot{text-align:center;color:var(--muted);font-size:13.5px;padding:0 8px}
.inicio{display:grid;gap:14px;margin:16px 0 12px}
.inicio .check{align-items:flex-start;font-weight:400}
.inicio .check input{margin-top:2px;flex:none}
.alt-inicio{margin-top:8px}
/* Instalar en el teléfono */
.instalar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;background:var(--paper);border-radius:12px;box-shadow:var(--shadow);border-left:4px solid var(--maize);padding:12px 12px 12px 14px;position:relative}
[data-inst="banner"] .instalar{margin-bottom:14px}
[data-inst="inicio"] .instalar{margin-top:14px}
.cuenta [data-inst] .instalar{box-shadow:none;background:var(--paper-2)}
.inst-ico{display:inline-flex;flex:none;color:var(--ink)}
.inst-ico svg{width:28px;height:28px}
.inst-t{flex:1 1 180px;min-width:0;display:grid;gap:2px;margin:0}
.inst-t b{font-size:16px}
.inst-t small{color:var(--muted);font-size:13.5px;line-height:1.35}
.instalar .btn.primary{flex:none}
.instalar.pasos .btn{flex:none}
.inst-x{position:absolute;top:2px;right:4px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;width:32px;height:32px;cursor:pointer}
[data-inst="banner"] .instalar{padding-right:36px}
details.instalar{display:block}
details.instalar summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;min-height:32px}
details.instalar summary::-webkit-details-marker{display:none}
details.instalar summary::after{content:"▾";margin-left:auto;color:var(--muted);font-size:18px;line-height:1;transition:transform .15s}
details.instalar[open] summary::after{transform:rotate(180deg)}
a.btn{text-decoration:none}
details.instalar ol{margin:12px 0 8px;padding-left:22px;display:grid;gap:6px;font-size:15px}
details.instalar .hint{margin:4px 0 10px}
.instalar.ok{border-left-color:var(--ok)}
.cuenta{display:grid;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.cuenta h3,.settings-sec h3{font-family:var(--sans);font-size:15px;font-weight:700}
.cuenta-btns{display:flex;flex-wrap:wrap;gap:8px}
.cuenta-btns .btn.danger{padding-left:12px;padding-right:12px}
img.cargando{background:var(--paper-2)}
img.sin-foto{opacity:.4}
#sync{background:var(--warn);color:#fff}

/* Bienvenida, cargando, aviso */
.welcome{max-width:620px;margin:10px auto;padding:28px 26px 30px}
.welcome h1{font-size:34px;font-weight:700;margin-bottom:10px}
.welcome p{margin-bottom:10px}
.welcome .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 22px}
.welcome .facts div{background:var(--paper-2);border-radius:8px;padding:12px}

}

/* Respaldo: un archivo con todos los camiones, pagos y fotos de la cuenta */
const RESP = {data: null};
function respaldoDocs() {
  const out = {config: {}, camiones: {}, tarifas: {}, liquidaciones: {}, turnos: {}, piezas: {}, mant: {}, deuda: {}};
  if (S.cfgMainExists && S.cfgMain) out.config.main = S.cfgMain;
  for (const t of S.camionesDocs) out.camiones[t.id] = stripDoc(t);
  for (const [k, v] of Object.entries(S.tarifasDocs)) out.tarifas[k] = v;
  for (const [c, key] of [['liquidaciones', 'liqsAll'], ['turnos', 'turnosAll'], ['piezas', 'piezasAll'], ['mant', 'mantAll'], ['deuda', 'deudaAll']]) for (const x of S[key]) out[c][x.id] = stripDoc(x);
  return out;
}
async function exportarRespaldo(btn) {
  const t0 = btn.textContent; btn.disabled = true;
  try {
    const colecciones = respaldoDocs();
    const ids = [...new Set([...S.liqsAll, ...S.turnosAll, ...S.mantAll].map(x => x.fotoId).filter(Boolean))];
    const fotos = {}; let i = 0, fallas = 0;
    for (const id of ids) {
      btn.textContent = `Preparando fotos ${++i} de ${ids.length}…`;
      try { const r = await store.assets.get(id); if (r) fotos[id] = {type: r.type, b64: r.b64}; else fallas++; } catch { fallas++; }
    }
    const data = {app: 'control-camiones', version: 1, exportado: new Date().toISOString(), cuenta: S.userEmail || '', colecciones, fotos};
    const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `respaldo-camiones-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast(fallas ? `Respaldo listo; ${plural(fallas, 'foto no se pudo', 'fotos no se pudieron')} bajar` : 'Respaldo descargado');
  } catch (e) { toast('No se pudo preparar el respaldo. ' + errMsg(e), true); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = t0; } }
}
function pedirRespaldo() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) leerRespaldo(f); };
  inp.click();
}
async function leerRespaldo(file) {
  let data = null;
  try { data = JSON.parse(await file.text()); } catch { data = null; }
  if (!data || data.app !== 'control-camiones' || !data.colecciones) { toast('Ese archivo no es un respaldo de este sistema.', true); return; }
  RESP.data = data;
  const c = data.colecciones, n = k => Object.keys(c[k] || {}).length, nf = Object.keys(data.fotos || {}).length;
  const filas = [['Camiones', n('camiones')], ['Pagos', n('liquidaciones')], ['Turnos', n('turnos')], ['Piezas', n('piezas')], ['Mantenimiento y gastos', n('mant')], ['Movimientos de deuda', n('deuda')], ['Fotos', nf]].filter(x => x[1]);
  const body = `<p>Este respaldo${data.exportado ? ' es del ' + fechaLarga(String(data.exportado).slice(0, 10)) : ''} y trae:</p>
    <dl class="lines preview">${filas.map(([k, v]) => `<div class="line"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
    <p class="hint">Se agrega a tu cuenta. Si ya tienes algo con el mismo código, se reemplaza por lo del respaldo.</p>
    <p class="hint" id="resp-prog"></p>`;
  openDlg(dlgShell('f-resp', 'Cargar respaldo', body, footBtns('', 'Cargar respaldo')));
}
function importarRespaldo(f, btn) {
  const d = RESP.data; if (!d) return;
  const prog = $('#resp-prog');
  return saveWith(f, btn, 'Cargando…', async () => {
    const c = d.colecciones, entries = [];
    for (const [coll, docs] of Object.entries(c)) if (/^(config|camiones|tarifas|liquidaciones|turnos|piezas|mant|deuda)$/.test(coll)) for (const [id, data] of Object.entries(docs || {})) entries.push([coll + '/' + id, data]);
    // Respaldos viejos sin camiones: se les crea el camión al que apuntan los pagos.
    if (!Object.keys(c.camiones || {}).length && entries.some(([p]) => /^(liquidaciones|turnos)\//.test(p))) { const v = virtualF250((c.config || {}).main); delete v.virtual; v.creado = new Date().toISOString(); entries.push(['camiones/f250', stripDoc(v)]); }
    const fotos = Object.entries(d.fotos || {});
    let i = 0;
    for (const [id, ft] of fotos) { if (prog) prog.textContent = `Subiendo fotos: ${++i} de ${fotos.length}…`; if (ft && ft.b64) await store.assets.putB64(id, ft.b64, ft.type); }
    await store.db.bulkSet(entries, (k, tot) => { if (prog) prog.textContent = `Guardando datos: ${k} de ${tot}…`; });
    const primero = Object.entries(c.camiones || {}).sort((x, y) => (x[1].orden ?? 0) - (y[1].orden ?? 0))[0];
    RESP.data = null; closeDlg();
    if (primero) setTruck(primero[0]); else if (entries.some(([p]) => p === 'camiones/f250')) setTruck('f250');
    S.tab = 'resumen'; render(); toast('Respaldo cargado');
  });
}

function toggleLine(act, label, on, subOn, subOff, ddOn) {

}
function descLines(t, r) {
  const c = cfgOf(t);
  if (!r.nCo) return r.otrosDesc > 0.004 ? line('−', 'Otros descuentos', 'En pagos en efectivo', r.otrosDesc) : '';
  const cxcSub = pctFmt(r2(r.brutoCo ? r.cxc / r.brutoCo * 100 : 0)) + ' del bruto';
  const estTxt = r.nEst ? `. Aproximado en ${plural(r.nEst, 'pago', 'pagos')} sin desglose` : '';

  const tarifa = l && p ? l.precios[p] : null, cant = num(S.calc.cantidad ?? c.cantidadViaje);

    + line('−', 'Chofer', pctFmt(c.pctChofer) + ' del bruto', ch)

    : `Te están descontando <b>${pctFmt(r2(pctTotal))}</b> del bruto: ${[c.calc7 && 'aporte ' + pctFmt(c.pctSiete), 'CXC ' + pctFmt(r2(pctOtro)), alc > 0 && 'alcabala ' + money(alc, 0)].filter(Boolean).join(', ')}`;
  out.innerHTML = html;
}

}
async function saveLeer(f, btn) {
  setErr(f, '');
  const t = cur(), c = cfgOf(t);
  const sel = RD.items.filter(it => it.status === 'listo' && it.pick && !it.dupOf);
  for (const it of sel) {
    const d = it.data, lab = d.comprobante ? '#' + d.comprobante : it.name;
    if (!d.fecha && !it.match?.mes) return setErr(f, `Al comprobante ${lab} le falta la fecha.`);
    if (!(d.bruto > 0)) return setErr(f, `Al comprobante ${lab} le falta el bruto.`);
    if (d.neto == null || d.neto < 0 || d.neto > d.bruto + 0.001) return setErr(f, `Revisa el neto del comprobante ${lab}.`);
  }
  btn.dataset.busy = '1'; btn.disabled = true;
  let done = 0, lastMes = null;
  try {
    for (const it of sel) {
      btn.textContent = `Guardando ${done + 1} de ${sel.length}…`;
      const d = it.data, m = it.match;
      const up = it.file && it.file.size && store.assets ? await subirFoto(it.file) : null;
      const base = m ? stripDoc(m) : {camion: t.id, efectivo: false, pctVenta: c.pctVentaComprobante, ventaFija: null, pctChofer: c.pctChofer, choferPagado: false, creado: new Date().toISOString()};
      const viajes = d.viajes > 0 ? Math.round(d.viajes) : (base.viajes || 1);
      const fecha = d.fecha || base.fecha || null;
      const data = {...base, camion: m ? truckOf(m) : t.id, fecha, mes: fecha ? fecha.slice(0, 7) : base.mes, comprobante: d.comprobante || base.comprobante || '', ticket: d.ticket || base.ticket || '',
        viajes, bruto: r2(d.bruto), neto: r2(d.neto), cxc: d.cxc,
        aporte: d.aporte ?? r2(d.bruto * c.pctSiete / 100), alcabala: d.alcabala ?? r2((c.alcabala || 0) * viajes), lineas: d.lineas || [], fotoId: up ? up.id : (base.fotoId || null)};
      delete data.cxcCom; delete data.cxcLub; delete data.cxcOtro;
      if (base.ventaFija != null && Math.abs((base.neto || 0) - data.neto) > 0.004) data.ventaFija = null;
      const id = m ? m.id : store.newId('liquidaciones');
      await store.set('liquidaciones', id, data);
      if (up && m?.fotoId && m.fotoId !== up.id) dropAsset(m.fotoId);
      it.status = 'guardado'; renderItem(it); done++;
      if (!lastMes || data.mes > lastMes) lastMes = data.mes;
    }
    delete btn.dataset.busy;
    if (lastMes) { S.mes = lastMes; S.mesAuto = false; }
    closeDlg(); S.tab = 'viajes'; render(); window.scrollTo(0, 0);
    toast(plural(done, 'comprobante guardado', 'comprobantes guardados'));
  } catch (e) {
    delete btn.dataset.busy; btn.disabled = false; leerStatus();
    setErr(f, (done ? `Se guardaron ${done}. ` : '') + errMsg(e));
  }
}

  try {
    await ensureMaterialized();
    const jobs = [...liqsOf(t).map(x => ['liquidaciones', x.id]), ...turnosOf(t).map(x => ['turnos', x.id]), ...piezasOf(t).map(x => ['piezas', x.id]), ...mantOf(t).map(x => ['mant', x.id]), ...deudaOf(t).map(x => ['deuda', x.id])];

    await toggleCfg(el, 'prestamoActivo', 'Préstamo activado', 'El préstamo ya no se resta');
    if (on && !(C().prestamo > 0)) openPrestamo();
  } else if (act === 'tgl-mant') {
    await toggleCfg(el, 'mantEnResumen', 'El mantenimiento se resta', 'El mantenimiento ya no se resta');
  } else if (el.id === 'c-origen') { S.calc.origen = el.value; S.calc.lugar = null; const rows = syncCalcRuta(); $('#c-lugar').innerHTML = hastaOptions(rows); S.calc.producto = null; setupCalc(); $('#tar-body').innerHTML = tarBody(); }
  else if (el.id === 'c-lugar') { S.calc.lugar = +el.value; S.calc.producto = null; setupCalc(); $('#tar-body').innerHTML = tarBody(); }
  else if (el.id === 'c-prod') { S.calc.producto = el.value; updateCalc(); $('#tar-body').innerHTML = tarBody(); }
  else if (el.id === 'c-7') { saveCfg({calc7: el.checked}).catch(err => toast(errMsg(err), true)); }
  else if (el.name === 'c-otro') {
    const v = el.value === 'monto' ? 'monto' : +el.value;
    $('#c-monto-f').hidden = v !== 'monto';
    saveCfg({calcOtro: v}).then(() => { if (v === 'monto') $('#c-monto')?.focus(); }).catch(err => toast(errMsg(err), true));
  }
  else if (el.form && el.form.id === 'f-deuda' && el.name === 'tipo') {
    const ab = el.value === 'abono', f = el.form;
    $('#deuda-conc').innerHTML = DEUDA_CONC[ab ? 'abono' : 'prestamo'].map(c => `<option value="${esc(c)}">`).join('');
    f.concepto.placeholder = ab ? 'Ej. Pagó en efectivo' : 'Ej. Adelanto';
    f.closest('dialog').querySelector('.dlg-head h2').textContent = ab ? 'El chofer me pagó' : 'Le presté al chofer';
  }
  else if (el.id === 'leer-pdf') { RD.pdfFile = (el.files && el.files[0]) || null; const n = $('#leer-pdf-name'); if (n) n.textContent = RD.pdfFile ? RD.pdfFile.name : ''; }
  else if (el.id === 'leer-files') { const fs = [...(el.files || [])]; el.value = ''; if (fs.length) readFiles(fs); }
  else if (act === 'rc-pick') { const it = RD.items.find(i => i.id === el.dataset.i); if (it) { it.pick = el.checked; $('#rc-' + it.id)?.classList.toggle('off', !it.pick); leerStatus(); } }
  else if (el.id === 'photo-file') { const file = el.files && el.files[0]; if (file) handlePhotoFile(file); }
  else if (el.form && el.form.id === 'f-reg' && el.name === 'pieza') {
    const pz = S.piezasAll.find(p => p.id === el.value), f = el.form;
    if (pz && !f.categoria.value.trim()) f.categoria.value = pz.categoria || '';
    f.descripcion.placeholder = pz ? 'Cambio de ' + low1(pz.nombre) : 'Ej. Reparación del clutch';
  }
  else if (el.form && el.form.id === 'f-liq') {
    if (el.name === 'tipo') {
      const f = el.form, ef = el.value === 'ef', c = C();
      $('#f-comp').hidden = ef;
      $('#pct-lab').textContent = ef ? '% de la cooperativa' : '% de venta del papel';
      f.pctVenta.value = ef ? c.pctVentaEfectivo : c.pctVentaComprobante;
      $('#desglose').hidden = ef;
      if (ef && !f.neto.value && f.bruto.value) f.neto.value = f.bruto.value;
      liqAuto('tipo');
      photoBox(ef ? 'Foto del recibo' : 'Foto del comprobante');
    }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'tar-q') { S.tarQ = el.value; $('#tar-body').innerHTML = tarBody(); }
  else if (el.id === 'c-cant') { S.calc.cantidad = el.value; updateCalc(); }
  else if (el.id === 'c-monto') { S.calc.monto = el.value; updateCalc(); }
  else if (el.dataset.rc) {
    const it = RD.items.find(i => i.id === el.dataset.rc); if (!it || !it.data) return;
    const k = el.dataset.k, v = el.value.trim();
    it.data[k] = k === 'fecha' ? (v || null) : k === 'comprobante' ? v.replace(/\D/g, '') : (v === '' ? null : num(v));
    if (k === 'comprobante') { matchItem(it); }
    const ck = $('#rcc-' + it.id); if (ck) ck.innerHTML = rcCheck(it);
  }
  else if (el.form && el.form.id === 'f-liq') {
    setErr(el.form, '');
    if (el.name === 'neto') LF.netoManual = true;
    if (el.name === 'aporte') LF.aporteManual = true;
    if (el.name === 'alcabala') LF.alcManual = true;
    liqAuto(el.name);
  }
});
const SUBMIT = {'f-auth': saveAuth, 'f-inicio': saveInicio, 'f-resp': importarRespaldo, 'f-deuda': saveDeuda, 'f-leer': saveLeer, 'f-origen': saveOrigen, 'f-liq': saveLiq, 'f-prestamo': savePrestamo, 'f-turno': saveTurno, 'f-lugar': saveLugar, 'f-prods': saveProds, 'f-ajustes': saveAjustes, 'f-camion': saveNuevoCamion, 'f-params': saveParams, 'f-km': saveKm, 'f-pieza': savePieza, 'f-reg': saveRegistro};
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, fn = SUBMIT[f.id];
  if (fn && PH.pdfBusy && f.querySelector('#photo-box')) { setErr(f, 'Espera a que termine de leer el PDF.'); return; }
  if (fn) fn(f, f.querySelector('button[type=submit]'));
});
dlg().addEventListener('click', e => { if (e.target === dlg()) closeDlg(); });
dlg().addEventListener('close', () => { dlg().classList.remove('wide'); if (RD.items.length || RD.prep) readReset(); PH.token++; PH.pdf = null; if (PH.url) { URL.revokeObjectURL(PH.url); PH.url = null; } });
document.addEventListener('error', e => { const im = e.target; if (im && im.tagName === 'IMG' && im.closest('.thumb')) im.replaceWith(document.createTextNode('Foto no disponible')); }, true);

/* ================= Arranque ================= */
let UNSUBS = [];
function subscribe(db) {
  UNSUBS.forEach(u => { try { u(); } catch {} }); UNSUBS = [];
  S.mode = 'loading'; S.got = {};
  const KEYS = ['cfg', 'cam', 'tar', 'liq', 'tur', 'pie', 'man', 'deu'];
  const ready = () => {
    if (S.mode === 'loading' && (KEYS.every(k => S.got[k]) || S.got.timeout)) S.mode = 'db';
    if (S.mode !== 'loading') scheduleRender();
  };
  let warned = false;
  const onErr = e => {
    if (warned || S.saliendo) return; warned = true;
    toast(e && e.code === 'permission-denied' ? 'No se pudo abrir tus datos: falta permiso. Cierra sesión y vuelve a entrar.' : 'Se perdió la conexión con tus datos. Recarga la página.', true);
  };
  // Sin señal se trabaja con lo guardado en el teléfono.
  const mark = (k, meta) => { if (!meta.fromCache || navigator.onLine === false) S.got[k] = true; };
  UNSUBS.push(db.doc('config/main').onSnapshot(s => { S.cfgMainExists = s.exists; S.cfgMain = s.data() || null; mark('cfg', s.metadata); ready(); }, onErr));
  UNSUBS.push(db.collection('tarifas').onSnapshot(q => { const o = {}; q.docs.forEach(d => { o[d.id] = d.data(); }); S.tarifasDocs = o; mark('tar', q.metadata); ready(); }, onErr));
  const coll = (name, key, k) => UNSUBS.push(db.collection(name).onSnapshot(q => { S[key] = q.docs.map(d => ({...d.data(), id: d.id})); mark(k, q.metadata); ready(); }, onErr));
  coll('camiones', 'camionesDocs', 'cam'); coll('liquidaciones', 'liqsAll', 'liq'); coll('turnos', 'turnosAll', 'tur'); coll('piezas', 'piezasAll', 'pie'); coll('mant', 'mantAll', 'man'); coll('deuda', 'deudaAll', 'deu');
  setTimeout(() => { S.got.timeout = true; ready(); }, navigator.onLine === false ? 1500 : 8000);
}
function boot() {
  const cfg = window.FIREBASE_CONFIG;
  if (!window.FB || !cfg || !cfg.apiKey || /PEGA|AQUI|TU_/i.test(String(cfg.apiKey))) { S.mode = 'setup'; render(); return; }
  try { FB.init(cfg); } catch (e) { S.mode = 'setup'; S.setupErr = String((e && e.message) || e); render(); return; }
  FB.onUser(u => {
    if (!u) {
      if (S.uid) { location.reload(); return; }
      S.mode = 'auth'; render(); return;
    }
    if (S.uid === u.uid) return;
    S.uid = u.uid; S.userName = u.displayName || AU.nombre || ''; S.userEmail = u.email || '';
    S.truckId = LS.get('camion-actual:' + u.uid);
    store.db = FB.makeDb(u.uid); store.assets = FB.makeFotos(u.uid); S.canPhotos = true;
    subscribe(store.db);
  });
}
window.addEventListener('online', () => render());
window.addEventListener('offline', () => render());
window.addEventListener('fb-write-error', e => toast(errMsg(e.detail), true));
S.mode = 'boot';
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitSelect($('#truck-sel'))).catch(() => {});
boot();

</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
